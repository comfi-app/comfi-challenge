services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: comfi
      POSTGRES_PASSWORD: comfi
      POSTGRES_DB: kyb
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comfi -d kyb"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
